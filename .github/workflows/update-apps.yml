name: Update apps.json

on:
  # Every 30 minutes, so new apps show up by themselves
  schedule:
    - cron: "*/30 * * * *"
  # Run it by hand from the Actions tab
  workflow_dispatch:
  # Run it when the script changes
  push:
    branches: [main]
    paths:
      - scripts/**

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build data/apps.json
        run: node scripts/build-apps-json.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/apps.json
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Update apps.json"
            git push
          fi
